<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu</title>
<link rel="stylesheet" href="common.css">
<style>
.group { grid-column: 1/-1; display: flex; align-items: baseline; gap: 8px; margin: 14px 0 -4px; }
.group:first-child { margin-top: 0; }
.group h2 { margin: 0; font-size: 20px; }
.list { list-style: none; padding: 0; margin: 0; }
.list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.list li > span:last-child { color: var(--muted); white-space: nowrap; }
.chosen li { align-items: center; }
.chosen img { width: 52px; height: 39px; object-fit: cover; border-radius: 6px; margin-right: 10px; }
.chosen span:first-child { display: flex; align-items: center; flex: 1; }
.chosen button { border: 0; background: none; color: var(--muted); font-size: 18px; padding: 0 6px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <input type="search" id="q" placeholder="Search dish or ingredient">
    <select id="protein"><option value="">Any protein</option></select>
    <select id="cuisine"><option value="">Any cuisine</option></select>
    <select id="time">
      <option value="">Any time</option><option value="15">15 min or less</option><option value="20">20 min or less</option>
      <option value="25">25 min or less</option>
    </select>
    <select id="kcal">
      <option value="">Any calories</option><option value="600">600 kcal or less</option><option value="750">750 kcal or less</option>
    </select>
    <select id="sort">
      <option value="name">Name</option><option value="minutes">Quickest</option><option value="kcal">Fewest calories</option>
    </select>
    <button class="plain" id="reset">Reset</button>
    <span class="muted" id="count"></span>
    <span class="grow"></span>
    <button class="primary" id="listBtn">Shopping list</button>
  </div>
</header>
<main class="grid" id="grid"></main>
<dialog id="listDlg"></dialog>

<script src="data/index.js"></script>
<script src="data/menu.js"></script>
<script src="data/sainsburys.js"></script>
<script src="data/ocado.js"></script>
<script src="common.js"></script>
<script>
const MENU = window.MY_MENU.kept.map(id => BY_ID.get(id)).filter(Boolean);
const CARBS = ["Pasta", "Rice", "Noodles", "Potato", "Grains", "Bread", "Other"];
const DEFAULTS = { q: "", protein: "", cuisine: "", time: "", kcal: "", sort: "name" };
const SELECTS = ["protein", "cuisine", "time", "kcal", "sort"];
let state = { ...DEFAULTS };
try { state = { ...DEFAULTS, ...JSON.parse(localStorage.getItem("menuFilters") || "{}") }; } catch {}
if (!["name", "minutes", "kcal"].includes(state.sort)) state.sort = "name";

const uniq = arr => [...new Set(arr)].sort();
[["protein", "p"], ["cuisine", "cu"]].forEach(([sel, key]) =>
  uniq(MENU.map(r => r[key])).forEach(v => $("#" + sel).insertAdjacentHTML("beforeend", `<option>${esc(v)}</option>`)));
function syncControls() {
  $("#q").value = state.q;
  SELECTS.forEach(k => $("#" + k).value = state[k]);
}
SELECTS.forEach(k => $("#" + k).onchange = e => { state[k] = e.target.value; render(); });
$("#q").oninput = e => { state.q = e.target.value; render(); };
$("#reset").onclick = () => { state = { ...DEFAULTS }; syncControls(); render(); };

const hay = r => r._h ??= [r.n, r.h, r.cf, r.cs, r.cu, r.p, ...r.i].join(" ").toLowerCase();
const sorters = {
  name: (a, b) => a.n.localeCompare(b.n),
  minutes: (a, b) => (a.m || 999) - (b.m || 999) || a.n.localeCompare(b.n),
  kcal: (a, b) => (a.k ?? 1e9) - (b.k ?? 1e9),
};

function card(r) {
  const on = basket.has(r.id);
  return `<div class="cardwrap"><button class="pick${on ? " on" : ""}" data-pick="${r.id}">${on ? "Added" : "Add"}</button>
    <button class="card" data-id="${r.id}">
      <div class="photo"><img loading="lazy" src="${esc(r.img)}" alt=""></div>
      <div class="body">
        <div class="tagline">${tagline(r)}</div>
        <h2>${esc(r.n)}</h2>
        <div class="sub">${esc(r.h)}</div>
        <div class="meta">${meta(r)}</div>
      </div>
    </button></div>`;
}

function render() {
  try { localStorage.setItem("menuFilters", JSON.stringify(state)); } catch {}
  const words = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const list = MENU.filter(r =>
    words.every(w => hay(r).includes(w)) &&
    (!state.protein || r.p === state.protein) &&
    (!state.cuisine || r.cu === state.cuisine) &&
    (!+state.time || (r.m && r.m <= +state.time)) &&
    (!+state.kcal || (r.k ?? 1e9) <= +state.kcal)
  ).sort(sorters[state.sort]);
  $("#count").textContent = `${list.length} of ${MENU.length}`;
  $("#grid").innerHTML = list.length ? CARBS.map(c => {
    const rs = list.filter(r => r.cf === c);
    return rs.length ? `<div class="group"><h2>${c}</h2><span class="muted">${rs.length}</span></div>${rs.map(card).join("")}` : "";
  }).join("") : `<div class="empty">No dishes match these filters.</div>`;
}
$("#grid").onclick = e => {
  const p = e.target.closest("[data-pick]");
  if (p) return toggleBasket(p.dataset.pick);
  const c = e.target.closest(".card");
  if (c) openRecipe(BY_ID.get(c.dataset.id), {
    has: () => basket.has(c.dataset.id),
    toggle: () => toggleBasket(c.dataset.id),
  });
};

// ---------- shopping list: the chosen dishes' ingredients (2 servings each), added up ----------
let basket = new Set();
try { basket = new Set((JSON.parse(localStorage.getItem("basket") || "{}").ids || []).filter(id => BY_ID.has(id))); } catch {}
function saveBasket() {
  try { localStorage.setItem("basket", JSON.stringify({ ids: [...basket] })); } catch {}
  $("#listBtn").textContent = basket.size ? `Shopping list (${basket.size})` : "Shopping list";
}
function toggleBasket(id) {
  basket.has(id) ? basket.delete(id) : basket.add(id);
  saveBasket();
  document.querySelectorAll(`[data-pick="${id}"]`).forEach(p => {
    p.classList.toggle("on", basket.has(id));
    p.textContent = basket.has(id) ? "Added" : "Add";
  });
}

function fmtQ(q, u) {
  const n = Math.round(q * 100) / 100;
  if (!u) return `${n}`;
  if (["g", "ml", "kg", "l"].includes(u)) return `${n}${u}`;
  if (["tsp", "tbsp"].includes(u)) return `${n} ${u}`;
  return `${n} ${u}${n > 1 ? (/(ch|sh|s)$/.test(u) ? "es" : "s") : ""}`;
}
async function totals(ids) {
  const ds = await Promise.all(ids.map(id => loadDetail(id).catch(() => null)));
  const lines = new Map();
  for (const d of ds) {
    for (const i of d?.ingredients || []) {
      if (!i.buy) continue;
      const key = i.buy.toLowerCase();
      if (!lines.has(key)) lines.set(key, { name: i.buy, img: i.img, byUnit: new Map(), other: [], dishes: new Set() });
      const L = lines.get(key);
      L.dishes.add(d.id);
      if (i.q == null) { if (i.amount) L.other.push(i.amount); continue; }
      L.byUnit.set(i.u || "", (L.byUnit.get(i.u || "") || 0) + i.q);
    }
  }
  return [...lines.values()].map(L => ({
    name: L.name, img: L.img, amount: [...[...L.byUnit].map(([u, q]) => fmtQ(q, u)), ...L.other].join(" + "),
    units: L.other.length ? [...L.byUnit, ["?", 1]] : [...L.byUnit], dishes: L.dishes.size, dishIds: [...L.dishes],
  })).sort((a, b) => a.name.localeCompare(b.name));
}

const listDlg = $("#listDlg");
async function openList() {
  const ids = [...basket];
  const lines = ids.length ? await totals(ids) : [];
  listDlg.innerHTML = `<div class="detail" style="position:relative"><button class="close" aria-label="Close">×</button>
    <h2>Shopping list</h2>
    ${ids.length ? `
      <ul class="list chosen" style="margin-top:12px">${ids.map(id => BY_ID.get(id)).map(r =>
        `<li><span><img src="${esc(r.img)}" alt="">${esc(r.n)}</span><button data-remove="${r.id}" aria-label="Remove">×</button></li>`).join("")}</ul>
      <div class="actions"><button class="primary" id="sendList">Send to Shopping list</button><button id="clearList">Clear</button></div>
      <div class="panelhead" style="margin-top:18px"><h3 style="margin:0">Ingredients <span class="muted">(2 servings each)</span></h3>${shopSwitch()}</div>
      ${shop ? shopList(lines) : `<ul class="list">${lines.map(l => `<li>${thumb(l)}<span class="grow">${esc(l.name)}</span><span>${esc(l.amount)}</span></li>`).join("")}</ul>`}`
    : `<p class="muted">No dishes added.</p>`}
  </div>`;
  if (!listDlg.open) listDlg.showModal();
}
const thumb = l => l.img ? `<img class="thumb" loading="lazy" src="${esc(l.img)}" alt="">` : `<span class="thumb"></span>`;
function shopList(lines) {
  let total = 0;
  const rows = lines.map(l => {
    const e = shopEntry(l.name);
    const packs = e?.n ? shopPacks(e, l.units, l.dishes) : 0;
    total += packs * (e?.pr || 0);
    return `<li>${thumb(l)}<span class="grow">${shopName(l.name, l.name, false)}</span><span>${esc(l.amount)}${packs ? ` → ${packs} × £${e.pr.toFixed(2)}` : ""}</span></li>`;
  });
  return `<p class="muted">${esc(shop.label)} products, whole packs: about <b>£${total.toFixed(2)}</b> (cupboard items included — you may already have them).</p>
    <ul class="list">${rows.join("")}</ul>`;
}
listDlg.onclick = e => {
  const t = e.target;
  if (t.closest("[data-shop]")) { setShop(t.closest("[data-shop]").dataset.shop); return openList(); }
  if (t === listDlg || t.closest(".close")) return listDlg.close();
  if (t.dataset.remove) { toggleBasket(t.dataset.remove); openList(); }
  if (t.id === "sendList") return sendList();
  if (t.id === "clearList") { [...basket].forEach(toggleBasket); openList(); }
};
async function sendList() {
  const btn = $("#sendList");
  btn.disabled = true;
  const items = (await totals([...basket])).map(l => ({
    title: l.amount ? `${l.name} — ${l.amount}` : l.name,
    description: "For: " + l.dishIds.map(id => BY_ID.get(id)?.n).filter(Boolean).join(", "),
  }));
  try {
    const r = await fetch("/api/shopping", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ items }) });
    if (!r.ok) throw new Error(r.statusText);
    btn.textContent = `Sent ${items.length} items ✓`;
  } catch {
    btn.disabled = false;
    btn.textContent = "Couldn't send, try again";
  }
}
$("#listBtn").onclick = openList;

saveBasket();
syncControls();
render();
</script>
</body>
</html>
