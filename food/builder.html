<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build menu</title>
<link rel="stylesheet" href="common.css">
<style>
.wrap { max-width: 760px; margin: 0 auto; padding: 22px 18px 60px; }
.wrap h2 { margin: 0 0 2px; font-size: 22px; }
.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.fam { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; }
.famhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.famhead b { font-size: 16px; min-width: 80px; }
.famhead .step { padding: 2px 9px; }
.progress { height: 5px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.progress div { height: 100%; background: var(--accent); }
.kept { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.kept span { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); border-radius: 99px;
  padding: 2px 4px 2px 10px; font-size: 12px; }
.kept button { border: 0; background: none; color: var(--muted); padding: 0 5px; }
.pickcard { background: var(--surface); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.pickcard img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: var(--line); }
.pickcard .body { padding: 14px 18px 18px; }
.pickcard h3 { margin: 4px 0 2px; font-size: 20px; }
.decide { display: flex; gap: 10px; margin-top: 14px; }
.decide button { flex: 1; padding: 13px; font-size: 16px; }
.spread { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script src="data/index.js"></script>
<script src="data/menu.js"></script>
<script src="common.js"></script>
<script>
const MINE_DEFAULTS = { kept: [], skipped: [], targets: { Rice: 20, Pasta: 20, Noodles: 15, Potato: 15, Grains: 10, Other: 5 },
  easy: true, maxTime: 30, minRating: 4.3, avoidProteins: [] };
// Working copy in this browser, restarted from my-menu.json whenever that file changes.
function loadMine() {
  let m = { ...MINE_DEFAULTS };
  try { m = { ...MINE_DEFAULTS, ...JSON.parse(localStorage.getItem("myMenu") || "{}") }; } catch {}
  const stamp = JSON.stringify(window.MY_MENU);
  try {
    if (localStorage.getItem("myMenuFile") !== stamp) {
      m = { ...MINE_DEFAULTS, ...window.MY_MENU };
      localStorage.setItem("myMenu", JSON.stringify(m));
      localStorage.setItem("myMenuFile", stamp);
    }
  } catch {}
  m.kept = m.kept.filter(id => BY_ID.has(id));
  return m;
}
let mine = loadMine();
const saveMine = () => { try { localStorage.setItem("myMenu", JSON.stringify(mine)); } catch {} };
const ratings = r => r.rc ? ` · ${r.r.toFixed(2)} from ${r.rc.toLocaleString()} ratings` : "";
const FAMILIES = ["Rice", "Pasta", "Noodles", "Potato", "Grains", "Other"];
const PROTEINS = ["Poultry", "Beef", "Pork", "Fish", "Lamb", "Veggie"];
let family = null, undo = [], current = null, confirmClear = null;
const app = $("#app");

function pool(f) {
  const avoidP = new Set(mine.avoidProteins), gone = new Set([...mine.kept, ...mine.skipped]);
  return R.filter(r => r.cf === f && !gone.has(r.id) && !avoidP.has(r.p) &&
    (!mine.easy || r.d === 1) && (!mine.maxTime || (r.m && r.m <= mine.maxTime)) &&
    r.r >= mine.minRating && r.rc >= 20);
}
const tally = (rs, key) => rs.reduce((m, r) => (m[r[key]] = (m[r[key]] || 0) + 1, m), {});
const pills = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="pill">${esc(k)} ${n}</span>`).join("");
const bar = (n, want) => `<div class="progress"><div style="width:${want ? Math.min(100, 100 * n / want) : 0}%"></div></div>`;

// The next dish: the one with the most ratings that hasn't been kept or skipped yet.
function nextDish(f) {
  let best = null;
  for (const r of pool(f)) if (!best || r.rc > best.rc) best = r;
  return best;
}

function renderOverview() {
  family = null;
  const kept = mine.kept.map(id => BY_ID.get(id)).filter(r => FAMILIES.includes(r.cf));
  const total = FAMILIES.reduce((a, f) => a + (mine.targets[f] || 0), 0);
  app.innerHTML = `
    <div class="top"><div class="grow"><h2>Build menu</h2><div class="muted">${kept.length} of ${total} picked</div></div>
      <button data-act="download">Download menu</button></div>
    <div class="top">
      <label class="muted"><input type="checkbox" data-set="easy" ${mine.easy ? "checked" : ""}> Easy only</label>
      <select data-set="maxTime">${[[20, "20 min or less"], [30, "30 min or less"], [40, "40 min or less"], [0, "Any time"]].map(([v, l]) =>
        `<option value="${v}" ${mine.maxTime === v ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select data-set="minRating">${[[4.5, "Rated 4.5+"], [4.3, "Rated 4.3+"], [4, "Rated 4.0+"]].map(([v, l]) =>
        `<option value="${v}" ${mine.minRating === v ? "selected" : ""}>${l}</option>`).join("")}</select>
    </div>
    <div class="chips" style="margin-bottom:16px"><span class="muted" style="align-self:center">Never show:</span>
      ${PROTEINS.map(p => `<button class="chip ${mine.avoidProteins.includes(p) ? "on" : ""}" data-avoid="${p}">${p}</button>`).join("")}</div>
    ${FAMILIES.map(f => {
      const ks = kept.filter(r => r.cf === f), want = mine.targets[f] || 0, left = pool(f).length;
      const seen = ks.length + mine.skipped.filter(id => BY_ID.get(id)?.cf === f).length;
      return `<div class="fam">
        <div class="famhead"><b>${f}</b><span class="muted">${ks.length} / ${want}</span>
          <button class="step" data-target="${f}" data-d="-1">−</button><button class="step" data-target="${f}" data-d="1">+</button>
          <span class="grow muted">${left} to choose from</span>
          ${seen ? (confirmClear === f
            ? `<button data-clear="${f}" data-sure="1">Clear ${ks.length} kept and skipped</button><button data-clear="">Cancel</button>`
            : `<button class="plain" data-clear="${f}">Clear</button>`) : ""}
          <button class="${ks.length < want && left ? "primary" : ""}" data-pick="${f}" ${left ? "" : "disabled"}>${ks.length ? "Pick more" : "Start"}</button></div>
        ${bar(ks.length, want)}
        ${ks.length ? `<div class="kept">${ks.map(r => `<span>${esc(r.n)}<button data-unkeep="${r.id}" title="Remove">×</button></span>`).join("")}</div>` : ""}
      </div>`;
    }).join("")}
    <div class="muted" style="margin-top:14px">Across the whole menu</div>
    <div class="spread">${pills(tally(kept, "p"))}</div><div class="spread">${pills(tally(kept, "cu"))}</div>`;
}

function renderPicker() {
  const kept = mine.kept.map(id => BY_ID.get(id)).filter(r => r.cf === family), want = mine.targets[family] || 0;
  current = nextDish(family);
  const r = current;
  app.innerHTML = `
    <div class="top"><button data-act="overview">All carbs</button>
      <div class="grow"><h2>${family}</h2><div class="muted">${kept.length} of ${want} kept · ${pool(family).length} left to see</div></div>
      <button data-act="undo" ${undo.length ? "" : "disabled"}>Undo</button></div>
    ${bar(kept.length, want)}
    ${kept.length >= want && want ? `<p>That's ${want} ${family.toLowerCase()} dishes. Keep going, or go back for the next carb.</p>` : ""}
    ${r ? `<div class="pickcard">
      <img src="${esc(r.img)}" alt="">
      <div class="body">
        <div class="tagline">${tagline(r)}</div>
        <h3>${esc(r.n)}</h3>
        <div class="sub">${esc(r.h)}</div>
        <div class="muted" style="margin-top:6px">${meta(r)}${ratings(r)} · <button class="plain" data-act="details" style="padding:0;color:var(--accent)">Details</button></div>
        <div class="decide"><button data-act="skip">Skip (S)</button><button class="primary" data-act="keep">Keep (K)</button></div>
      </div></div>` : `<p class="muted">No more ${family.toLowerCase()} dishes match the limits.</p>`}
    ${kept.length ? `<div class="muted" style="margin-top:16px">Kept so far</div>
      <div class="spread">${pills(tally(kept, "cu"))}</div><div class="spread">${pills(tally(kept, "p"))}</div><div class="spread">${pills(tally(kept, "cs"))}</div>` : ""}`;
}

function decide(keep) {
  if (!current) return;
  (keep ? mine.kept : mine.skipped).push(current.id);
  undo.push([keep ? "kept" : "skipped", current.id]);
  saveMine();
  renderPicker();
}
app.onclick = e => {
  const t = e.target.closest("button");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "overview") renderOverview();
  else if (act === "keep" || act === "skip") decide(act === "keep");
  else if (act === "details" && current) openRecipe(current);
  else if (act === "undo") {
    const [list, id] = undo.pop();
    mine[list] = mine[list].filter(x => x !== id);
    saveMine();
    renderPicker();
  }
  else if (act === "download") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(mine, null, 1)], { type: "application/json" }));
    a.download = "my-menu.json";
    a.click();
  }
  else if (t.dataset.pick) { family = t.dataset.pick; undo = []; renderPicker(); }
  else if (t.dataset.target) { mine.targets[t.dataset.target] = Math.max(0, (mine.targets[t.dataset.target] || 0) + +t.dataset.d); saveMine(); renderOverview(); }
  else if (t.dataset.unkeep) { mine.kept = mine.kept.filter(x => x !== t.dataset.unkeep); saveMine(); renderOverview(); }
  else if (t.dataset.clear !== undefined) {
    const f = t.dataset.clear;
    if (f && t.dataset.sure) {
      const inF = id => BY_ID.get(id)?.cf === f;
      mine.kept = mine.kept.filter(id => !inF(id));
      mine.skipped = mine.skipped.filter(id => !inF(id));
      saveMine();
      confirmClear = null;
    } else confirmClear = f || null;
    renderOverview();
  }
  else if (t.dataset.avoid) {
    const p = t.dataset.avoid;
    mine.avoidProteins = mine.avoidProteins.includes(p) ? mine.avoidProteins.filter(x => x !== p) : [...mine.avoidProteins, p];
    saveMine();
    renderOverview();
  }
};
app.onchange = e => {
  const k = e.target.dataset.set;
  if (!k) return;
  mine[k] = e.target.type === "checkbox" ? e.target.checked : +e.target.value;
  saveMine();
  renderOverview();
};
document.addEventListener("keydown", e => {
  if (!family || !current || document.querySelector("dialog[open]")) return;
  if (e.key === "k" || e.key === "K") decide(true);
  if (e.key === "s" || e.key === "S") decide(false);
});

renderOverview();
</script>
</body>
</html>
